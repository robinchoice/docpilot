# Secret scan in .github/workflows/secrets.yml, on top of the gitleaks default rules.
[extend]
useDefault = true

# dist/ is the bundled action including third-party code: a JSDoc example in
# @actions/core trips the entropy rule generic-api-key. Only that rule is skipped
# there, real token formats like ghp_ or sk-or- are still caught in these files.
[[allowlists]]
description = "Bundled action in dist/"
targetRules = ["generic-api-key"]
paths = ['''(^|/)dist/''']
