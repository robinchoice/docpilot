# Secret scan in .github/workflows/secrets.yml, on top of the gitleaks default rules.
[extend]
useDefault = true

# dist/ bundles third-party code; a JSDoc example in @actions/core trips generic-api-key.
[[allowlists]]
description = "Bundled action in dist/"
targetRules = ["generic-api-key"]
paths = ['''(^|/)dist/''']
