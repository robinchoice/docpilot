name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      # The action runs the committed dist/, so it must be built from this src/
      - name: Check that dist/ matches src/
        run: |
          bun run build
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"
